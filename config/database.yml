default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: gig_saathi_development

test:
  <<: *default
  database: gig_saathi_test

production:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "gig_saathi_production") %>
